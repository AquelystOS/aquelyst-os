[theme]
# AqueLyst brand: cyan (Aque) + lime (Lyst). primaryColor drives Streamlit's
# default accents — keep aligned with --accent in app.py.
primaryColor = "#06b6d4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
