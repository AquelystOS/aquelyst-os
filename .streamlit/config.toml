[theme]
# AqueLyst brand cyan as Streamlit's primary accent. We tell Streamlit it's
# a LIGHT theme (white bg, dark text) so widgets inside our white cards
# render with dark legible text — then override the visible page background
# to dark via custom CSS in app.py (.stApp gradient). Best of both worlds:
# dark dashboard surface + readable white-card widgets.
primaryColor = "#06b6d4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
